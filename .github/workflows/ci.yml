name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a release commit (a tag can be moved); the comment names the release. The Rust toolchain is
# the exact one in backend/rust-toolchain.toml, installed by the runner's own rustup (no third-party action).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain (backend/rust-toolchain.toml)
        run: rustup toolchain install   # no argument: the toolchain of rust-toolchain.toml
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (offline fakes; live smoke tests run only with NEMO_LIVE=1)
        run: cargo test --locked --workspace
      - name: Install cargo-deny and cargo-audit (exact versions, from crates.io)
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
      - name: Licenses, bans, sources, advisories (cargo-deny)
        run: cargo deny check
      - name: RustSec advisories (cargo-audit)
        run: cargo audit
      - name: Dependency cooldown (every locked crate at least 14 days old; security fixes excepted)
        run: python3 -I tools/crate-age.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Tests (no dependencies to install)
        run: npm test

  e2e:
    # Every page and tab in a real headless Chrome against the real backend (frontend/e2e/run.mjs), hermetic: every
    # upstream URL closed, an empty PATH. Unit tests cannot see a view that fails to load in the browser; this job can.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the backend (Cargo.lock)
        working-directory: backend
        run: |
          rustup toolchain install   # no argument: the toolchain of rust-toolchain.toml
          cargo build --locked
      - name: Browser end-to-end (google-chrome from the runner image)
        run: node frontend/e2e/run.mjs

  parity:
    # The Rust backend against the last Python backend (tag python-final, pinned in parity/ref.mjs): every API route
    # through the differential harness, persisted state read both ways, startup errors and the launcher CLI; plus the
    # route-coverage and test-map gates (every pytest id of the Python suite maps to a Rust #[test]).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PARITY_UV_ONLINE: "1"   # the reference venv is built once from python-final's own uv.lock (PyPI)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0        # the reference is `git archive` of python-final (or the commit it must name)
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the backend (Cargo.lock)
        working-directory: backend
        run: |
          rustup toolchain install   # no argument: the toolchain of rust-toolchain.toml
          cargo build --locked
      - name: Harness self-tests, test map, route coverage
        run: |
          node --test parity/tests/lib.test.mjs
          node backend/tools/gen-test-map.mjs --check
          node parity/check-test-map.mjs --no-pending
          node parity/check-routes.mjs
      - name: Python reference (python-final)
        run: node parity/ref.mjs
      - name: Differential run, every route (parity/allow-diffs.txt lists the accepted deviations)
        run: node parity/run.mjs --a python --b rust --allow-diff-routes parity/allow-diffs.txt
      - name: Persisted state both ways, startup errors, launcher CLI
        run: |
          node parity/xstate.mjs
          node parity/startup.mjs
          node parity/launcher.mjs
