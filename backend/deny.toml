# cargo-deny policy, adapted from harness2-workbench's (https://embarkstudios.github.io/cargo-deny/).
# Run from rust/: cargo deny check. Changing an allow-list here is a supply-chain decision: say why in the commit.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[output]
feature-depth = 1

[advisories]
# Every RustSec advisory (vulnerability, unsound, unmaintained, yanked) fails the check unless listed here with a
# reason and a review date.
ignore = []

[licenses]
# Permissive licences compatible with distributing an MIT binary.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    { crate = "openssl-sys", reason = "rustls only; no system OpenSSL dependency" },
    { crate = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
