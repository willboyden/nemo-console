[project]
name = "nemo-console"
version = "0.3.0"
description = "Nemo Console: monitor, configure and interact with NeMo Switchyard, NeMo Relay and NVIDIA Dynamo"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "William Boyden" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "prometheus-client>=0.21",
]

[project.urls]
Repository = "https://github.com/willboyden/nemo-console"
Issues = "https://github.com/willboyden/nemo-console/issues"
Changelog = "https://github.com/willboyden/nemo-console/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
nemo-console = "nemo_console.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_console"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
