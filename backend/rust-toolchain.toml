# One exact toolchain for every developer and CI job, so a green build means the same thing
# everywhere. Bump deliberately (docs/RELEASING.md) and re-run the full gate when you do.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# the config editor's validators are also built for the browser (`make wasm`, ADR-0022)
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
